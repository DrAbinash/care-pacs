server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Docker embedded DNS — resolve Orthanc at request time so nginx can start
    # even if Orthanc is briefly unavailable (viewer /healthz must not depend on it).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Liveness: static viewer assets only (does not require Orthanc studies).
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok\n';
    }

    location = /app-config.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    location /care/ {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # Preserve working proxy behaviour: pass full URI to Orthanc.
    # Orthanc DicomWeb.Root is /dicom-web/
    location /dicom-web {
        set $orthanc_upstream orthanc:8042;
        proxy_pass http://$orthanc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location /wado {
        set $orthanc_upstream orthanc:8042;
        proxy_pass http://$orthanc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
