name: care-pacs

# Permanent architecture (2026-08):
#   Modalities → Orthanc → OHIF
#   care-erp-sync: Orthanc → ERP (study intake)
#   Care ERP API: writes .wl into shared worklists (MWL)
#   mwl-guard: quarantines invalid .wl BEFORE Orthanc housekeeper can crash
#
# Shared MWL folder with Care ERP (care-api mounts the same host path at
# /orthanc-worklists via ORTHANC_WORKLIST_HOST_DIR). Create on NAS first:
#   mkdir -p /volume1/docker/care-pacs/orthanc/worklists
#   mkdir -p /volume1/docker/care-pacs/orthanc/worklists-bad
#   mkdir -p /volume1/docker/care-pacs/orthanc/worklists-staging

services:

  postgres:
    image: postgres:16
    container_name: care-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orthanc
      POSTGRES_USER: orthanc
      POSTGRES_PASSWORD: ${ORTHANC_PG_PASSWORD}
    volumes:
      - /volume1/docker/care-pacs/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - care-pacs-net

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: care-orthanc
    restart: unless-stopped
    depends_on:
      mwl-guard:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_PLUGIN_ENABLED: "true"
      ORTHANC__POSTGRESQL__HOST: postgres
      ORTHANC__POSTGRESQL__PORT: "5432"
      ORTHANC__POSTGRESQL__DATABASE: orthanc
      ORTHANC__POSTGRESQL__USERNAME: orthanc
      ORTHANC__POSTGRESQL__PASSWORD: ${ORTHANC_PG_PASSWORD}
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "false"
      ORTHANC__POSTGRESQL__ENABLE_SSL: "false"
    ports:
      - "5680:4242"   # DICOM C-STORE / C-ECHO / MWL C-FIND
      - "8042:8042"   # Orthanc web/API
    volumes:
      - /volume1/docker/care-pacs/orthanc/data:/var/lib/orthanc/db
      - /volume1/docker/care-pacs/orthanc/config/orthanc.json:/etc/orthanc/orthanc.json:ro
      - /volume1/docker/care-pacs/orthanc/scripts:/etc/orthanc/scripts:ro
      # Antigravity MWL — Care API writes .wl files; Orthanc serves them to MRI/CT/USG
      - /volume1/docker/care-pacs/orthanc/worklists:/var/lib/orthanc/worklists
    networks:
      - care-pacs-net

  # Defense-in-depth: remove malformed ERP .wl files so Orthanc never terminates.
  # Starts before Orthanc; continues polling while Orthanc runs.
  mwl-guard:
    image: python:3.11-slim
    container_name: care-mwl-guard
    restart: unless-stopped
    environment:
      MWL_WORKLIST_DIR: /var/lib/orthanc/worklists
      MWL_QUARANTINE_DIR: /var/lib/orthanc/worklists-bad
      MWL_GUARD_POLL_SECONDS: "2"
      MWL_GUARD_STABLE_SECONDS: "1"
      MWL_GUARD_READY_FILE: /tmp/mwl-guard-ready
    volumes:
      - /volume1/docker/care-pacs/mwl-guard:/app:ro
      - /volume1/docker/care-pacs/orthanc/worklists:/var/lib/orthanc/worklists
      - /volume1/docker/care-pacs/orthanc/worklists-bad:/var/lib/orthanc/worklists-bad
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python mwl_guard.py"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/mwl-guard-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - care-pacs-net

  orthanc-puller:
    image: python:3.11-slim
    container_name: care-orthanc-puller
    restart: unless-stopped
    depends_on:
      - orthanc
    volumes:
      - /volume1/docker/care-pacs/orthanc-puller:/app
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python orthanc_auto_puller.py"
    networks:
      - care-pacs-net

  care-erp-sync:
    image: python:3.11-slim
    container_name: care-erp-sync
    restart: unless-stopped
    depends_on:
      - orthanc
    volumes:
      - /volume1/docker/care-pacs/care-erp-sync:/app
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python care_erp_sync.py"
    networks:
      - care-pacs-net

  # Rolling Orthanc study retention (gated by ERP Advanced → Auto-retention switch).
  # Copies script from this repo path on the NAS; default policy keeps ~500 studies.
  orthanc-retention:
    image: python:3.11-slim
    container_name: care-orthanc-retention
    restart: unless-stopped
    depends_on:
      - orthanc
    environment:
      ORTHANC_URL: http://care-orthanc:8042
      KEEP_STUDIES: "500"
      CLEANUP_TRIGGER: "520"
      CHECK_INTERVAL_SECONDS: "300"
      MIN_STUDY_AGE_MINUTES: "60"
      # Same dual-LAN ERP path as care-erp-sync — override in .env if needed.
      ERP_BASE_URL: ${ERP_BASE_URL:-http://172.16.1.139:8888}
      ERP_ALT_BASE_URLS: ${ERP_ALT_BASE_URLS:-http://192.168.1.137:8888}
      ERP_INTERNAL_API_KEY: ${ERP_INTERNAL_API_KEY:-1234}
    volumes:
      - /volume1/docker/care-pacs/orthanc-retention:/app
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python orthanc_retention.py"
    networks:
      - care-pacs-net

  ohif:
    build:
      # Relative to this compose file (repo root). On Synology the checkout lives at
      # /volume1/docker/care-pacs — keep compose cwd there so the context resolves.
      context: ./ohif/enterprise
      dockerfile: Dockerfile
      args:
        OHIF_REF: v3.10.0
        OHIF_COMMIT: 0b6e9cba7613dba1df883985d3c821a86b3ba0ff
        CARE_VIEWER_VERSION: 1.0.1-p0-branding
    image: care-ohif-enterprise:v1
    container_name: care-ohif
    restart: unless-stopped
    depends_on:
      - orthanc
    ports:
      - "3010:80"
    volumes:
      # Optional runtime allowlist overrides (no secrets). Image ships a fail-closed default;
      # replace/edit this host file on the NAS without rebuilding OHIF.
      - ./ohif/enterprise/care-customization/care-config.runtime.js:/usr/share/nginx/html/care/care-config.js:ro
    # Image also defines HEALTHCHECK; compose healthcheck mirrors viewer + config only.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/app-config.js || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - care-pacs-net

  tailscale-ohif:
    image: tailscale/tailscale:latest
    container_name: care-tailscale-ohif
    restart: unless-stopped
    hostname: ohif-viewer
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - /volume1/docker/care-pacs/tailscale-ohif/state:/var/lib/tailscale
      - /volume1/docker/care-pacs/tailscale-ohif/serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - ohif
    networks:
      - care-pacs-net

networks:
  care-pacs-net:
    name: care-pacs-net
    driver: bridge
